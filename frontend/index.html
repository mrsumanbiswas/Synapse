<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Synapse: a distributed knowledge graph and semantic search engine for research papers." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Synapse</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("synapse.theme"); } catch (e) {}
        var dark = saved === "dark" || ((!saved || saved === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
